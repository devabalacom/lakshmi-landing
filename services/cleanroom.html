<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Текстиль для чистых помещений | Лакшми</title>
    <meta name="description" content="Антистатическая одежда для фармпроизводства">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="fixed w-full bg-white shadow-md z-50">
        <nav class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="../index.html" class="text-2xl font-bold"><span class="text-blue-600">Лакшми</span></a>
            <a href="tel:+74996477281" class="bg-blue-600 text-white px-6 py-2 rounded-lg">+7 499 647-72-81</a>
        </nav>
    </header>

    <section class="pt-24 pb-16 bg-gradient-to-br from-gray-50 to-blue-50">
        <div class="container mx-auto px-4">
            <div class="max-w-4xl mx-auto text-center">
                <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-6">Текстиль для чистых помещений</h1>
                <p class="text-xl text-gray-700 mb-8">Антистатическая одежда для фармпроизводства</p>
                <a href="#contact" class="bg-blue-600 text-white px-8 py-4 rounded-lg text-lg font-semibold hover:bg-blue-700 transition inline-block">
                    Получить расчет
                </a>
            </div>
        </div>
    </section>

    <section class="py-16 bg-white">
        <div class="container mx-auto px-4">
            <div class="max-w-4xl mx-auto">
                <p class="text-lg text-gray-700 mb-8">Пошив для фармы, биотеха, лабораторий. Антистатика, пыленепроницаемость, стерильность.</p>
            </div>
        </div>
    </section>

    <section id="contact" class="py-16 bg-gradient-to-br from-blue-600 to-blue-800">
        <div class="container mx-auto px-4">
            <div class="max-w-2xl mx-auto">
                <h2 class="text-3xl font-bold text-center text-white mb-8">Отправьте ТЗ на расчет</h2>
                <form class="bg-white rounded-lg p-8">
                    <div class="space-y-4">
                        <input type="text" placeholder="Имя" required class="w-full px-4 py-3 border rounded-lg">
                        <input type="tel" placeholder="Телефон" required class="w-full px-4 py-3 border rounded-lg">
                        <textarea placeholder="Опишите задачу" rows="4" class="w-full px-4 py-3 border rounded-lg"></textarea>
                        <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-lg font-semibold hover:bg-blue-700">
                            Отправить заявку
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <footer class="bg-gray-900 text-white py-12">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2026 Лакшми. Все права защищены.</p>
        </div>
    </footer>
</body>
</html>
