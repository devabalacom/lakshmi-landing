name: Deploy to пром-текстиль.рф

on:
  push:
    branches: [main]
    paths:
      - 'v-liquid-glass/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./v-liquid-glass/
          server-dir: ./
          timeout: 60000
          log-level: standard
          security: loose
