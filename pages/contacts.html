<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты | Лакшми</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header class="fixed w-full bg-white shadow-md z-50">
        <nav class="container mx-auto px-4 py-4">
            <a href="../index.html" class="text-2xl font-bold"><span class="text-blue-600">Лакшми</span></a>
        </nav>
    </header>

    <section class="pt-32 pb-16">
        <div class="container mx-auto px-4 max-w-5xl">
            <h1 class="text-5xl font-bold mb-12 text-center">Контакты</h1>
            
            <div class="grid md:grid-cols-2 gap-12">
                <div>
                    <h2 class="text-2xl font-bold mb-6">Свяжитесь с нами</h2>
                    <div class="space-y-4">
                        <div>
                            <h3 class="font-semibold text-lg mb-2">Телефон</h3>
                            <a href="tel:+74996477281" class="text-blue-600 text-xl">+7 499 647-72-81</a>
                        </div>
                        <div>
                            <h3 class="font-semibold text-lg mb-2">Email</h3>
                            <a href="mailto:laksmillc@yandex.ru" class="text-blue-600">laksmillc@yandex.ru</a>
                        </div>
                        <div>
                            <h3 class="font-semibold text-lg mb-2">Адрес</h3>
                            <p>Санкт-Петербург<br>Литовская 12 к Д</p>
                        </div>
                        <div>
                            <h3 class="font-semibold text-lg mb-2">Режим работы</h3>
                            <p>Пн-Пт: 9:00 - 18:00<br>Сб-Вс: выходной</p>
                        </div>
                    </div>
                </div>

                <div>
                    <h2 class="text-2xl font-bold mb-6">Отправьте заявку</h2>
                    <form class="space-y-4">
                        <input type="text" placeholder="Имя" required class="w-full px-4 py-3 border rounded-lg">
                        <input type="tel" placeholder="Телефон" required class="w-full px-4 py-3 border rounded-lg">
                        <textarea placeholder="Сообщение" rows="5" class="w-full px-4 py-3 border rounded-lg"></textarea>
                        <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-lg font-semibold hover:bg-blue-700">
                            Отправить
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-gray-900 text-white py-12">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2026 Лакшми. Все права защищены.</p>
        </div>
    </footer>
</body>
</html>
